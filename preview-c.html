<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>预览 C</title>
<style>
@font-face{font-family:'Space';src:url('prevfonts/spacegrotesk-400-n.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Space';src:url('prevfonts/spacegrotesk-500-n.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Space';src:url('prevfonts/spacegrotesk-700-n.woff2') format('woff2');font-weight:700}
@font-face{font-family:'Inter';src:url('prevfonts/inter-300-n.woff2') format('woff2');font-weight:300}
@font-face{font-family:'Inter';src:url('prevfonts/inter-400-n.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Inter';src:url('prevfonts/inter-500-n.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Inter';src:url('prevfonts/inter-600-n.woff2') format('woff2');font-weight:600}
@font-face{font-family:'SCSans';src:url('prevfonts/scsans-0.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'SCSerif';src:url('prevfonts/scserif-0.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--bg:#fdfae7;--primary:#1e2bfa;--text:#111;--muted:#6b6b6b;--light:#9a9a9a;--card:rgba(30,43,250,.04);--border:rgba(30,43,250,.2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#e6e2d0;overflow:hidden}
.stage{position:fixed;inset:0}
#deck{position:absolute;top:50%;left:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(1);
 background:var(--bg);color:var(--text);padding:78px 96px 64px;display:flex;flex-direction:column;
 font-family:'Inter','SCSans',sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--primary);padding-bottom:18px;border-bottom:1.5px solid var(--border)}
.mid{flex:1;display:grid;grid-template-columns:1fr 1.05fr;gap:52px;align-items:center;margin-top:26px}
h1{font-family:'Space','SCSans',sans-serif;font-weight:700;font-size:98px;line-height:1.08;letter-spacing:.005em}
h1 span{color:var(--primary)}
.lede{font-size:23px;line-height:1.65;color:var(--muted);margin-top:20px;max-width:700px}
.kpis{margin-top:34px;display:flex;flex-direction:column;gap:0}
.kpi{display:grid;grid-template-columns:64px 1fr;gap:16px;padding:18px 0;border-top:1px solid var(--border);align-items:baseline}
.kpi:last-child{border-bottom:1px solid var(--border)}
.kpi b{font-family:'Space',sans-serif;font-size:26px;font-weight:700;color:var(--primary)}
.kpi p{font-size:21px;line-height:1.45;color:var(--text)}
.kpi p em{font-style:normal;color:var(--muted);font-size:19px;display:block;margin-top:3px}
.fig{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:18px}
.fig img{width:100%;display:block;border-radius:8px;background:#fff}
.cap{display:flex;justify-content:space-between;font-size:14px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--light);margin-top:12px}
.bottom{display:flex;justify-content:space-between;font-size:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--light);margin-top:auto}
</style></head><body><div class="stage"><div id="deck">
  <div class="top"><span>Non-Trade Tax · System</span><span>FY2026</span></div>
  <div class="mid">
    <div>
      <h1>非贸备案扣税<br><span>多维表流程系统</span></h1>
      <p class="lede">名录、备案、扣税三层双向关联，税率、账户、类别字段自动带出，十处自动通知替代人工催办。</p>
      <div class="kpis">
        <div class="kpi"><b>01</b><p>名录 · 供应商主数据<em>一商一档，唯一来源</em></p></div>
        <div class="kpi"><b>02</b><p>备案 · 合同与支付<em>一合同一条记录</em></p></div>
        <div class="kpi"><b>03</b><p>扣税 · 税金与凭证<em>一条记录回溯备案合同</em></p></div>
      </div>
    </div>
    <div>
      <div class="fig"><img src="img/non-trade-tables.png" alt=""></div>
      <div class="cap"><span>Figure 01 — 三层表结构</span><span>Data Foundation</span></div>
    </div>
  </div>
  <div class="bottom"><span>财税数字化 · 2026</span><span>01 / 03</span></div>
</div></div><script>
const deck=document.getElementById('deck');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);deck.style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);fit();
</script></body></html>
