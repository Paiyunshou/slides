<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>预览 A</title>
<style>
@font-face{font-family:'Jost';src:url('prevfonts/jost-200-n.woff2') format('woff2');font-weight:200}
@font-face{font-family:'Jost';src:url('prevfonts/jost-300-n.woff2') format('woff2');font-weight:300}
@font-face{font-family:'Lora';src:url('prevfonts/lora-it-400-i.woff2') format('woff2');font-weight:400;font-style:italic}
@font-face{font-family:'Mono';src:url('prevfonts/jost-300-n.woff2') format('woff2')}
@font-face{font-family:'SCSans';src:url('prevfonts/scsans-0.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'SCSerif';src:url('prevfonts/scserif-0.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--paper:#FAFADF;--paper2:#F2F2D2;--warm:#F5F0E4;--ink:#1A1A16;--graphite:#5E5E54;--light:#8A8A80}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#e8e8e0;overflow:hidden}
.stage{position:fixed;inset:0}
#deck{position:absolute;top:50%;left:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(1);
 background:var(--paper);color:var(--ink);padding:74px 96px 58px;display:flex;flex-direction:column;
 font-family:'Jost','SCSans',sans-serif}
.top{display:flex;justify-content:space-between;font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:var(--graphite);padding-bottom:16px;border-bottom:1px solid var(--ink)}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;min-height:0}
.eyebrow{font-size:18px;letter-spacing:.28em;text-transform:uppercase;color:var(--graphite)}
h1{font-size:80px;font-weight:200;line-height:1.14;letter-spacing:.02em;max-width:1500px}
h1 em{display:block;font-family:'Lora',serif;font-style:italic;font-weight:400;font-size:44px;line-height:1.2;margin-top:16px;color:var(--graphite)}
.lede{font-size:21px;font-weight:300;line-height:1.6;color:var(--graphite);max-width:1250px}
.fig{border:1px solid var(--ink);background:#fff;padding:0;line-height:0;width:1080px;max-height:100%;overflow:hidden}
.fig img{width:100%;display:block}
.figcap{display:flex;gap:26px;align-items:baseline;font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--light);margin-top:10px}
.bottom{display:flex;justify-content:space-between;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--light);border-top:1px solid rgba(26,26,22,.25);padding-top:14px;margin-top:auto}
</style></head><body><div class="stage"><div id="deck">
  <div class="top"><span>Non-Trade Tax · Multidimensional Tables</span><span>01 — 03</span></div>
  <div class="mid">
    <div class="eyebrow">数据底座 / Data Foundation</div>
    <h1>非贸备案扣税<br>多维表流程系统 <em>a ledger of three layers</em></h1>
    <p class="lede">名录、备案、扣税三层双向关联：一商一档维护供应商主数据，一合同一条记录备案与流程状态，一条扣税记录回溯上游合同。</p>
    <div class="fig"><img src="img/non-trade-tables.png" alt=""></div>
    <div class="figcap"><span>Fig. 01</span><span>三层表结构与关联字段 — 名录 / 备案 / 扣税</span></div>
  </div>
  <div class="bottom"><span>财税数字化 · 2026</span><span>Paiyunshou</span></div>
</div></div><script>
const deck=document.getElementById('deck');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);deck.style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);fit();
</script></body></html>
