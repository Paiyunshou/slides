<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幻灯片合集 · Slides</title>
<style>
:root{
  /* Monad tokens */
  --parchment:#f6f3f1;
  --lake-blue:#2b59d1;
  --periwinkle:#cfdaf5;
  --sky:#a0b5eb;
  --mint:#a7fccd;
  --coral:#ff9473;
  --gold:#ecda98;
  --off-black:#242424;
  --ink:#000;
  --graphite:#4e4d4d;
  --smoke:#797776;
  --ash:#cecac8;

  --mono:"ABC Diatype Mono", ui-monospace, "SFMono-Regular", Consolas, Menlo, "Courier New", monospace;
  --serif:"Untitled Serif", Georgia, "Times New Roman", "Songti SC", "Noto Serif CJK SC", SimSun, serif;

  --card-radius:40px;
  --pill:9999px;
  --pad:clamp(20px,2.2vw,32px);
  --gap:clamp(14px,2vh,24px);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
  position:relative;
  min-height:100dvh;
  height:100dvh;
  overflow:hidden;
  display:flex;flex-direction:column;
  background:var(--parchment);
  color:var(--off-black);
  font-family:var(--mono);
  font-size:16px;line-height:1.35;letter-spacing:-.4px;
  -webkit-font-smoothing:antialiased;
}

/* —— 渐变氛围（规范：柔和模糊光晕，不用纯色块） —— */
body::before,
body::after{
  content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  filter:blur(70px);
}
body::before{
  width:38vw;height:38vw;top:-14vw;left:-8vw;
  background:radial-gradient(circle at 40% 40%, rgba(255,148,115,.55), rgba(160,181,235,.42) 55%, transparent 72%);
}
body::after{
  width:34vw;height:34vw;bottom:-16vw;right:-6vw;
  background:radial-gradient(circle at 50% 50%, rgba(160,181,235,.45), rgba(167,252,205,.38) 60%, transparent 74%);
}

/* —— 顶部墨色公告条 —— */
.topbar{
  position:relative;z-index:2;
  height:36px;flex:0 0 36px;
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:0 clamp(16px,3vw,32px);
  background:var(--ink);color:var(--parchment);
  font-size:12px;letter-spacing:-.033em;text-transform:uppercase;
}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:500}
.topbar .dot{width:7px;height:7px;border-radius:50%;background:var(--mint)}
.topbar .tag{
  border:1px solid rgba(246,243,241,.55);border-radius:var(--pill);
  padding:3px 12px;font-size:11px;white-space:nowrap;
}

main{
  position:relative;z-index:2;
  flex:1 1 auto;min-height:0;
  width:100%;max-width:1432px;margin:0 auto;
  padding:clamp(18px,3vh,40px) clamp(20px,4vw,64px) clamp(14px,2.4vh,28px);
  display:flex;flex-direction:column;justify-content:center;gap:var(--gap);
}

/* —— 首屏标题区 —— */
.hero{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap}
.eyebrow{
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--smoke);margin-bottom:8px;
}
h1{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(34px,4.4vw,60px);line-height:1.05;letter-spacing:-.02em;
  color:var(--off-black);
}
.hero p.lede{
  max-width:38ch;color:var(--graphite);
  font-size:clamp(13px,1.05vw,15px);line-height:1.5;
}

/* —— 两大类卡片 —— */
.cols{
  flex:0 1 auto;min-height:0;
  display:grid;grid-template-columns:1.08fr .92fr;gap:var(--gap);
}

.card{
  display:flex;flex-direction:column;min-height:clamp(220px,34vh,360px);
  border-radius:var(--card-radius);
  padding:var(--pad);
  border:1px solid var(--ash);
  background:transparent;
}
.card--work{
  background:var(--periwinkle);
  border-color:rgba(160,181,235,.75);
}
.card--tools{--tint:rgba(255,255,255,.62)}

.card-head{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-bottom:14px;margin-bottom:4px;
  border-bottom:1px solid rgba(0,0,0,.10);
}
.card-head .label{
  display:flex;align-items:center;gap:10px;
  font-size:12px;text-transform:uppercase;letter-spacing:-.033em;color:var(--off-black);
}
.card-head .label .num{color:var(--smoke)}
.card-head h2{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(20px,1.9vw,26px);letter-spacing:-.02em;
}
.count{
  border:1px solid rgba(0,0,0,.18);border-radius:var(--pill);
  padding:2px 10px;font-size:11px;color:var(--graphite);white-space:nowrap;
}

.list{flex:1 1 auto;min-height:0;max-height:calc(100dvh - 430px);overflow-y:auto;margin:0 -6px;padding:0 6px;display:flex;flex-direction:column;justify-content:center}
.list>*{flex:0 0 auto}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:rgba(0,0,0,.14);border-radius:99px}

/* —— deck 条目 —— */
.item{
  --tint:rgba(255,255,255,.5);
  display:flex;align-items:center;gap:14px;
  padding:clamp(12px,1.6vh,18px) 10px;
  border-bottom:1px solid rgba(0,0,0,.08);
  text-decoration:none;color:inherit;border-radius:16px;
  transition:background .18s ease, transform .18s ease;
}
.card--work .item{--tint:rgba(255,255,255,.45)}
.item:hover{background:var(--tint);transform:translateX(2px)}
.item .idx{font-size:11px;color:var(--smoke);min-width:22px}
.item .body{flex:1 1 auto;min-width:0}
.item .t{
  display:block;
  font-family:var(--serif);font-weight:400;
  font-size:clamp(16px,1.35vw,21px);letter-spacing:-.02em;line-height:1.25;
  color:var(--off-black);
}
.item .m{
  display:block;margin-top:4px;font-size:11px;text-transform:uppercase;
  letter-spacing:.04em;color:var(--graphite);
}
.item .arw{font-size:16px;color:var(--off-black);opacity:.55;transition:opacity .18s,transform .18s}
.item:hover .arw{opacity:1;transform:translateX(3px)}

/* —— 空状态 —— */
.empty{
  flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;color:var(--smoke);padding:20px;min-height:140px;
}
.empty .dash{
  font-family:var(--serif);font-size:32px;line-height:1;color:var(--ash);
}
.empty p{font-size:12px;text-transform:uppercase;letter-spacing:.05em;line-height:1.6;max-width:28ch}

/* —— 页脚 —— */
footer{
  position:relative;z-index:2;flex:0 0 auto;
  width:100%;max-width:1432px;margin:0 auto;
  padding:0 clamp(20px,4vw,64px) 14px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--smoke);
}
footer .right{display:flex;align-items:center;gap:8px}
footer .swatch{width:9px;height:9px;border-radius:50%}
footer .swatch.a{background:var(--coral)}
footer .swatch.b{background:var(--sky)}
footer .swatch.c{background:var(--mint)}

@media (max-width:820px){
  body{overflow:auto;height:auto;min-height:100dvh}
  .cols{grid-template-columns:1fr}
  .card{min-height:auto}
  .list{overflow:visible}
  .hero{gap:14px}
}
</style>
</head>
<body>

<div class="topbar">
  <span class="brand"><span class="dot"></span>SLIDES · 幻灯片合集</span>
  <span class="tag">PROJECT DECKS</span>
</div>

<main>
  <header class="hero">
    <div>
      <div class="eyebrow">Paiyunshou / deck archive</div>
      <h1>项目幻灯片</h1>
    </div>
    <p class="lede">财税与工具两条线的可视化演示归档，每个 deck 都是一个独立的 HTML 页面，点开即看。</p>
  </header>

  <section class="cols">

    <!-- ▍工作类：新增 deck 时，复制下面任意一个 <a class="item"> 并改标题、链接、说明 -->
    <article class="card card--work">
      <div class="card-head">
        <div>
          <div class="label"><span class="num">01</span>WORK · 工作</div>
          <h2>业务与项目</h2>
        </div>
        <span class="count">1 DECK</span>
      </div>
      <div class="list">
        <a class="item" href="./tax-table-design.html">
          <span class="idx">01</span>
          <span class="body">
            <span class="t">区域税金管理系统设计框架</span>
            <span class="m">DESIGN FRAMEWORK · 2026.10</span>
          </span>
          <span class="arw">→</span>
        </a>
      </div>
    </article>

    <!-- ▍工具技能类 -->
    <article class="card card--tools">
      <div class="card-head">
        <div>
          <div class="label"><span class="num">02</span>TOOLKIT · 工具技能</div>
          <h2>方法与工具</h2>
        </div>
        <span class="count">0 DECK</span>
      </div>
      <div class="empty">
        <div class="dash">—</div>
        <p>暂无 deck<br>新幻灯片放进本仓库后在此归档</p>
      </div>
    </article>

  </section>
</main>

<footer>
  <span>2026 · Paiyunshou</span>
  <span class="right">
    <span class="swatch a"></span><span class="swatch b"></span><span class="swatch c"></span>
    <span>MONAD STYLE</span>
  </span>
</footer>

</body>
</html>
