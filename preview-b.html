<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>预览 B</title>
<style>
@font-face{font-family:'Cormorant';src:url('prevfonts/cormorant-500-n.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Cormorant';src:url('prevfonts/cormorant-500-i.woff2') format('woff2');font-weight:500;font-style:italic}
@font-face{font-family:'Cormorant';src:url('prevfonts/cormorant-600-n.woff2') format('woff2');font-weight:600}
@font-face{font-family:'Worksans';src:url('prevfonts/worksans-300-n.woff2') format('woff2');font-weight:300}
@font-face{font-family:'Worksans';src:url('prevfonts/worksans-400-n.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Worksans';src:url('prevfonts/worksans-500-n.woff2') format('woff2');font-weight:500}
@font-face{font-family:'SCSans';src:url('prevfonts/scsans-0.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'SCSerif';src:url('prevfonts/scserif-0.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--paper:#F2EEDF;--paper2:#ECE6D2;--ink:#2A241B;--soft:#5C5345;--pink:#E1A4C2;--lemon:#D6DD63;--blush:#E8C9B6;--sage:#B7C7A8;--lilac:#C9BEDC}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#dcd8c8;overflow:hidden}
.stage{position:fixed;inset:0}
#deck{position:absolute;top:50%;left:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(1);
 background:var(--paper);color:var(--ink);padding:80px 96px 64px;display:flex;flex-direction:column;
 font-family:'Worksans','SCSans',sans-serif}
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.top .dots{display:flex;gap:8px}
.top .dots i{width:15px;height:15px;border-radius:50%;display:block}
.mid{flex:1;display:grid;grid-template-columns:1.02fr .98fr;gap:44px;align-items:center;margin-top:22px}
h1{font-family:'Cormorant','SCSerif',serif;font-weight:500;font-size:118px;line-height:1.0;letter-spacing:.005em}
h1 em{font-style:italic;color:#8a5a44}
.lede{font-size:24px;font-weight:300;line-height:1.75;color:var(--soft);margin-top:22px;max-width:760px}
.cards{display:flex;gap:14px;margin-top:34px}
.chip{border-radius:999px;padding:12px 24px;font-size:19px;font-weight:500;letter-spacing:.02em}
.c1{background:var(--sage)}.c2{background:var(--lemon)}.c3{background:var(--blush)}
.card{background:rgba(255,255,255,.62);border-radius:34px;padding:26px;border:1px solid rgba(42,36,27,.10)}
.card img{width:100%;display:block;border-radius:14px;background:#fff}
.cap{display:flex;justify-content:space-between;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-top:14px}
.bottom{display:flex;justify-content:space-between;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-top:auto}
</style></head><body><div class="stage"><div id="deck">
  <div class="top"><span>非贸备案扣税 · 多维表流程系统</span><span class="dots"><i style="background:#E1A4C2"></i><i style="background:#D6DD63"></i><i style="background:#B7C7A8"></i><i style="background:#C9BEDC"></i></span></div>
  <div class="mid">
    <div>
      <h1>三层<em>多维表</em><br>一本流程账</h1>
      <p class="lede">名录、备案、扣税三层双向关联：一商一档维护供应商主数据，一合同一条记录备案与流程状态，一条扣税记录回溯上游合同。</p>
      <div class="cards"><span class="chip c1">名录</span><span class="chip c2">备案</span><span class="chip c3">扣税</span></div>
    </div>
    <div class="card">
      <img src="img/non-trade-tables.png" alt="">
      <div class="cap"><span>Fig. 01</span><span>三层表结构</span></div>
    </div>
  </div>
  <div class="bottom"><span>财税数字化 · 2026</span><span>01 / 03</span></div>
</div></div><script>
const deck=document.getElementById('deck');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);deck.style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);fit();
</script></body></html>
